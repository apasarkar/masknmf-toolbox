name: Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, windows-2025, macos-latest]
    env:
      UV_PYTHON_PREFERENCE: only-managed  # the runner's own python has no tkinter, which roicat imports
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Software vulkan driver for the offscreen canvas
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libegl1
      - run: uv sync --all-extras
      - run: uv run pytest tests
