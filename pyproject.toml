[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "masknmf"
version = "0.1.0"
description = "masknmf pipeline for motion correction, denoising, compression, and demixing of functional neuroimaging data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11, <3.14"  # ">=3.10"
authors = [
    { name = "Amol Pasarkar" },
]
keywords = ["neuroimaging", "motion correction", "demixing", "calcium imaging"]

dependencies = [
    "torch>2",
    "numpy",
    "scipy",
    "h5py",
    "scikit-image",
    "opencv-contrib-python-headless",
    "cvxpy>=1.6.5",
    "networkx",
    "tqdm",
    "plotly",
    "matplotlib",
    "jupyterlab",
    "pytorch-lightning>=2.5.2",
    "tensorboard>=2.20.0",
    "fastplotlib[imgui,notebook] @ git+https://github.com/fastplotlib/fastplotlib@b2132e3d11b9e2bd641e0bbfc0bbee3d413d1d88",  # add_imgui_window / NDWidget are unreleased
    "imgui-bundle==1.92.801",  # wgpu<=0.32 needs cmd_lists_count (gone in 1.92.900), fastplotlib needs the newer add_polyline
    "simplejpeg",
    "glfw",
    "oasis-deconv"
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-gallery",
    "pydata-sphinx-theme",
    "sphinx-copybutton",
    "sphinx-design",
    "pandoc",
    "imageio[ffmpeg]",
]

multisession = [
    "roicat[tracking_latest] >= 1.7.7", #First release that has this extras structure
    "onnx2torch" # This will eventually be removed
]

classification = [
    "roicat[classification_latest] >= 1.7.7", #First release that has this extras structure
]

dev = [
    "pytest>=8.4.0",
    "ruff>=0.11.13",
    "nbmake",
    "masknmf[docs]",
]



[project.scripts]
classification = "masknmf.visualization.classification_vis:main"

[project.urls]
Homepage = "https://github.com/apasarkar/masknmf-toolbox"
Repository = "https://github.com/apasarkar/masknmf-toolbox"
Issues = "https://github.com/apasarkar/masknmf-toolbox/issues"
